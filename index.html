<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Todo</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 34rem;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    h1 { font-size: 1.4rem; }
    form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
    input[type="text"] { flex: 1; padding: .5rem; }
    button { padding: .5rem .9rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li {
      display: flex; align-items: center; gap: .75rem;
      padding: .5rem 0; border-bottom: 1px solid #ddd;
    }
    li.done span { text-decoration: line-through; opacity: .5; }
    span { flex: 1; }
    small { opacity: .7; }
  </style>
</head>
<body>
  <h1>Team Todo <small>RFC-0001</small></h1>
  <form id="add-form">
    <input type="text" id="new-task" placeholder="What needs doing?" autocomplete="off" required />
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <script>
    const KEY = "team-todo-tasks";
    let tasks = JSON.parse(localStorage.getItem(KEY) || "[]");

    const list = document.getElementById("list");
    const form = document.getElementById("add-form");
    const input = document.getElementById("new-task");

    function render() {
      list.innerHTML = "";
      tasks.forEach((task, i) => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("done");

        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = task.done;
        box.addEventListener("change", () => {
          tasks[i].done = box.checked;
          save();
        });

        const span = document.createElement("span");
        span.textContent = task.text;

        const del = document.createElement("button");
        del.textContent = "×";
        del.setAttribute("aria-label", "Delete task");
        del.addEventListener("click", () => {
          tasks.splice(i, 1);
          save();
        });

        li.append(box, span, del);
        list.appendChild(li);
      });
    }

    function save() {
      localStorage.setItem(KEY, JSON.stringify(tasks));
      render();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      tasks.push({ text: input.value.trim(), done: false });
      input.value = "";
      save();
    });

    render();
  </script>
</body>
</html>
