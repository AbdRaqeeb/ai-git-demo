name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanity-check the single-file app
        run: |
          test -f index.html
          grep -q '<title>Team Todo</title>' index.html
          grep -q 'localStorage' index.html
          echo "index.html looks good"